<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Bank | Historial</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-protegida>

  <nav class="navbar navbar-expand-md navbar-light">
    <a class="navbar-brand" href="acciones.html"><img src="images/logo.png" alt="Logo">Pokémon Bank</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="acciones.html">Acciones</a></li>
        <li class="nav-item"><a class="nav-link active" href="historial.html">Historial</a></li>
        <li class="nav-item"><a class="nav-link" href="grafico.html">Gráfico</a></li>
        <li class="nav-item"><a class="nav-link text-danger salir" href="index.html">Salir</a></li>
      </ul>
    </div>
  </nav>

  <!-- PANTALLA 3: HISTORIAL DE TRANSACCIONES -->
  <main class="container mt-4">
    <h1 class="h4">Historial de transacciones</h1>
    <p id="datosCuenta" class="text-muted"></p>

    <!-- Resumen por tipo (lo llena js/historial.js) -->
    <div class="row">
      <div class="col-6 col-md-3">
        <div class="tarjeta" id="resumenDepositos">
          <p class="etiqueta mb-1">Depósitos (<span class="cantidad">0</span>)</p>
          <p class="h5 positivo mb-0 total">$0.00</p>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="tarjeta" id="resumenRetiros">
          <p class="etiqueta mb-1">Retiros (<span class="cantidad">0</span>)</p>
          <p class="h5 negativo mb-0 total">$0.00</p>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="tarjeta" id="resumenServicios">
          <p class="etiqueta mb-1">Servicios (<span class="cantidad">0</span>)</p>
          <p class="h5 negativo mb-0 total">$0.00</p>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="tarjeta" id="resumenConsultas">
          <p class="etiqueta mb-1">Consultas (<span class="cantidad">0</span>)</p>
          <p class="h5 mb-0 total">$0.00</p>
        </div>
      </div>
    </div>

    <!-- Tabla de transacciones (table-responsive = se puede deslizar en celular) -->
    <div class="tarjeta table-responsive">
      <table class="table table-hover mb-0">
        <thead class="thead-light">
          <tr>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Detalle</th>
            <th class="text-right">Monto</th>
          </tr>
        </thead>
        <tbody id="tablaHistorial">
          <!-- Las filas las agrega js/historial.js desde LocalStorage -->
        </tbody>
      </table>
    </div>

    <p class="text-right"><strong>Saldo actual: <span id="saldoActual"></span></strong></p>
  </main>

  <footer>Pokémon Bank © 2026 · Cajero automático</footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/historial.js"></script>
</body>
</html>
