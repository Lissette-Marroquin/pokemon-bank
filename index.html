<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Bank | Iniciar sesión</title>
  <link rel="icon" href="images/logo.png">
  <!-- Framework CSS: Bootstrap 4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- PANTALLA 1: LOGIN CON PIN -->
  <main class="login">
    <div class="tarjeta">
      <img src="images/logo.png" alt="Logo Pokémon Bank">
      <h1 class="h4 mt-2">Pokémon Bank</h1>
      <p class="text-muted">Cajero automático</p>

      <form id="formLogin">
        <label for="pin" class="etiqueta">Ingrese su PIN de 4 dígitos</label>
        <input type="password" id="pin" class="form-control pin" maxlength="4"
               pattern="[0-9]{4}" inputmode="numeric" placeholder="••••" required>
        <p id="error" class="mensaje-error"></p>

        <!-- Teclado numérico del cajero -->
        <div class="teclado">
          <button type="button" class="btn">1</button>
          <button type="button" class="btn">2</button>
          <button type="button" class="btn">3</button>
          <button type="button" class="btn">4</button>
          <button type="button" class="btn">5</button>
          <button type="button" class="btn">6</button>
          <button type="button" class="btn">7</button>
          <button type="button" class="btn">8</button>
          <button type="button" class="btn">9</button>
          <button type="button" class="btn" id="borrar">⌫</button>
          <button type="button" class="btn">0</button>
          <button type="submit" class="btn btn-rojo">OK</button>
        </div>
      </form>

      <small class="d-block text-muted mt-3">Nunca comparta su PIN con nadie.</small>
    </div>
  </main>

  
  <!-- Librería SweetAlert - Josué -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert@2.1.2/dist/sweetalert.min.js"></script>

  <!-- Datos (LocalStorage), validaciones, mensajes y login -->
  <!-- ValidateJS: validación de los campos -->
  <script src="https://cdn.jsdelivr.net/npm/validate.js@0.13.1/validate.min.js"></script>

  <script src="js/datos.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/dialogos.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
