<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo Chart.js</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

  <!-- Ejemplo 2: Chart.js dibuja gráficos dentro de un <canvas> -->
  <h1 class="h4 text-center">Ejemplo de Chart.js</h1>
  <p class="text-center">Número de transacciones por tipo.</p>
  <canvas id="grafico"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>
  <script>
    new Chart(document.getElementById("grafico"), {
      type: "bar",
      data: {
        labels: ["Depósitos", "Retiros", "Consultas", "Servicios"],
        datasets: [{
          label: "Transacciones",
          data: [3, 2, 1, 4],
          backgroundColor: ["#087451", "#bd0010", "#3286d8", "#f4a51c"]
        }]
      },
      options: {
        scales: { yAxes: [{ ticks: { beginAtZero: true } }] }
      }
    });
  </script>
</body>
</html>
